<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkMatch Practice Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        html, body { width: 100%; height: 100%; background: #0f1b18; color: #e5efec; overflow: hidden; }
        .page { display: flex; flex-direction: column; height: 100vh; }

        .topbar { height: 64px; min-height: 64px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; border-bottom: 1px solid #1f322d; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 38px; height: 38px; background: #6b21a8; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .brand h1 { font-size: 14px; font-weight: 700; }
        .brand p { font-size: 10px; color: #8aa59d; }
        .secure { font-size: 12px; color: #8aa59d; }
        .live { font-size: 12px; color: #cfe3dc; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; }

        .main { flex: 1; display: flex; min-height: 0; }
        .video-area { flex: 1; display: flex; gap: 16px; padding: 16px; min-width: 0; }

        /* Big YOU tile */
        .tile { background: linear-gradient(160deg, #1f3d35, #14251f); border: 1px solid #1f322d; border-radius: 16px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
        .tile-you { flex: 1; min-width: 0; }
        .tile-coach { width: 190px; min-width: 190px; height: 45%; align-self: flex-end; }
        .avatar-big { width: 72px; height: 72px; border-radius: 50%; background: #b86a4e; color: white; font-family: 'Playfair Display', serif; font-size: 24px; display: flex; justify-content: center; align-items: center; }
        .avatar-coach { width: 48px; height: 48px; border-radius: 50%; background: #6b21a8; color: white; font-size: 14px; font-weight: 600; display: flex; justify-content: center; align-items: center; }
        .tile-name { font-size: 11px; color: #cfe3dc; }
        .tag-you { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,0.45); font-size: 10px; padding: 4px 8px; border-radius: 6px; }
        .caption-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 80%; background: rgba(0,0,0,0.75); color: #ffffff; font-size: 12px; padding: 8px 14px; border-radius: 8px; text-align: center; }

        /* Right panel */
        .side { width: 320px; min-width: 320px; border-left: 1px solid #1f322d; padding: 24px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
        .side-label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #8aa59d; }
        .side h2 { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; padding-bottom: 12px; border-bottom: 1px solid #1f322d; }
        .question { font-family: 'Playfair Display', serif; font-size: 22px; line-height: 1.3; margin: 6px 0; }
        .tip-box { background: #14302a; border: 1px solid #1f4a40; border-radius: 10px; padding: 12px 14px; }
        .tip-title { font-size: 10px; font-weight: 700; color: #cfe3dc; margin-bottom: 4px; }
        .tip-text { font-size: 11px; color: #8aa59d; line-height: 1.4; }
        .btn-feedback { background: #ffffff; color: #581c87; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-next { background: #6b21a8; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Bottom controls */
        .controls { height: 80px; min-height: 80px; border-top: 1px solid #1f322d; display: flex; justify-content: center; align-items: center; gap: 20px; position: relative; }
        .ctrl { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #cfe3dc; font-size: 10px; cursor: pointer; }
        .ctrl-circle { width: 44px; height: 44px; border-radius: 50%; background: #1f322d; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .ctrl.off .ctrl-circle { background: #7f1d1d; }
        .ctrl.on .ctrl-circle { background: #34d399; color: #064e3b; font-weight: 700; font-size: 12px; }
        .btn-leave { position: absolute; right: 24px; background: #b4475a; color: white; border: none; padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="brand">
                <div class="brand-icon">🎥</div>
                <div>
                    <h1>WorkMatch Meet</h1>
                    <p>Private practice room</p>
                </div>
            </div>
            <div class="secure">🛡 Encrypted in-app session</div>
            <div class="live"><span class="live-dot"></span>Practice in progress</div>
        </div>

        <div class="main">
            <div class="video-area">
                <div class="tile tile-you">
                    <div class="avatar-big" id="youAvatar">--</div>
                    <div class="tile-name" id="youName"></div>
                    <div class="tag-you">You</div>
                    <div class="caption-bar" id="captionBar"></div>
                </div>
                <div class="tile tile-coach">
                    <div class="avatar-coach">AI</div>
                    <div class="tile-name">Practice coach</div>
                </div>
            </div>

            <div class="side">
                <div class="side-label" id="questionCount">Question</div>
                <h2>Practice interview</h2>
                <div class="question" id="questionText">Loading...</div>
                <div class="tip-box">
                    <div class="tip-title">✨ Answering tip</div>
                    <div class="tip-text" id="tipText"></div>
                </div>
                <button type="button" class="btn-feedback" id="btnFeedback">Get answer feedback</button>
                <button type="button" class="btn-next" id="btnNext" onclick="nextQuestion()">Next question ›</button>
            </div>
        </div>

        <div class="controls">
            <button type="button" class="ctrl" id="btnMic" onclick="this.classList.toggle('off')">
                <span class="ctrl-circle">🎤</span>Mute
            </button>
            <button type="button" class="ctrl" id="btnCam" onclick="this.classList.toggle('off')">
                <span class="ctrl-circle">📹</span>Stop video
            </button>
            <button type="button" class="ctrl on" id="btnCaptions" onclick="toggleCaptions()">
                <span class="ctrl-circle">CC</span>Captions
            </button>
            <button type="button" class="btn-leave" onclick="leaveRoom()">Leave room</button>
        </div>
    </div>

    <script>
        let questions = [];
        let current = 0;

        // Two letters for the round avatar
        function getInitials(name) {
            if (!name) return '--';
            const parts = name.trim().split(/\s+/);
            if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }

        // Shows the question at position "current"
        function showQuestion() {
            const q = questions[current];
            document.getElementById('questionCount').innerText = 'QUESTION ' + (current + 1) + ' OF ' + questions.length;
            document.getElementById('questionText').innerText = q.questionText;
            document.getElementById('tipText').innerText = q.tip || '';
            document.getElementById('captionBar').innerText = q.questionText;
            // No next question after the last one
            document.getElementById('btnNext').disabled = (current === questions.length - 1);
        }

        function nextQuestion() {
            if (current < questions.length - 1) {
                current++;
                showQuestion();
            }
        }

        // Shows or hides the caption bar
        function toggleCaptions() {
            const btn = document.getElementById('btnCaptions');
            btn.classList.toggle('on');
            document.getElementById('captionBar').style.display = btn.classList.contains('on') ? 'block' : 'none';
        }

        function leaveRoom() {
            window.location.href = '/dashboard.html';
        }

        // Loads the applicant name and the questions from the database
        function loadRoom() {
            fetch('/api/applicant/me')
                .then(res => {
                    if (res.status === 401) {
                        window.location.href = '/login.html';
                        return null;
                    }
                    return res.json();
                })
                .then(me => {
                    if (!me) return;
                    document.getElementById('youName').innerText = me.fullName;
                    document.getElementById('youAvatar').innerText = getInitials(me.fullName);
                    return fetch('/api/practice/questions');
                })
                .then(res => (res && res.ok) ? res.json() : null)
                .then(list => {
                    if (!list) return;
                    if (!Array.isArray(list) || list.length === 0) {
                        document.getElementById('questionText').innerText = 'No practice questions yet.';
                        document.getElementById('btnNext').disabled = true;
                        return;
                    }
                    questions = list;
                    showQuestion();
                });
        }

        window.onload = loadRoom;
    </script>
</body>
</html>
